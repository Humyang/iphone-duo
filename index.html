<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Duo · 折叠预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <div id="viewport" aria-label="iPhone Duo 3D 模型。拖拽旋转，滚轮缩放。"></div>
    <a class="github-link" href="https://github.com/Humyang/iphone-duo" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目" title="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
    </a>
    <div class="control-dock">
    <aside class="screen-panel" aria-label="屏幕界面">
      <div class="panel-heading"><h2>屏幕界面</h2></div>
      <div class="ui-themes" role="tablist" aria-label="屏幕界面类型"><button role="tab" data-ui-theme="wallpaper" aria-selected="true" disabled>壁纸</button><button role="tab" data-ui-theme="launcher" aria-selected="false" disabled>启动器</button><button role="tab" data-ui-theme="custom" aria-selected="false" disabled>自定义</button></div>
      <input id="ui-upload" type="file" accept="image/*,video/*" hidden disabled>
      <div class="shell-section">
        <div class="panel-heading"><h2>机身颜色</h2></div>
        <div class="shell-colors" role="radiogroup" aria-label="机身颜色">
          <button role="radio" data-shell-color="white" aria-label="星光白" aria-checked="true" disabled title="星光白"></button>
          <button role="radio" data-shell-color="black" aria-label="黑色" aria-checked="false" disabled title="黑色"></button>
          <button role="radio" data-shell-color="blue" aria-label="蓝色" aria-checked="false" disabled title="蓝色"></button>
          <button role="radio" data-shell-color="pink" aria-label="粉色" aria-checked="false" disabled title="粉色"></button>
          <button role="radio" data-shell-color="gold" aria-label="金色" aria-checked="false" disabled title="金色"></button>
          <button role="radio" data-shell-color="image" aria-label="自定义图案" aria-checked="false" disabled title="自定义图案"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zm2 2v8l4-5 3.5 4.5L17 9l3 3V6zm-1 14h14l-4-5-3 3.5L9 15l-4 5z"/></svg></button>
        </div>
        <input id="body-upload" type="file" accept="image/*" hidden disabled>
      </div>
    </aside>
    <section class="controls" aria-label="折叠动画控制">
      <button id="play" class="play" aria-label="播放动画" disabled><svg id="pause-icon" viewBox="0 0 24 24" hidden><path d="M8 6v12M16 6v12"/></svg><svg id="play-icon" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></svg></button>
      <input id="angle" aria-label="折叠进度" type="range" min="0" max="180" value="180" step="0.1" disabled>
      <button id="export" class="export" aria-label="导出视频" disabled>导出视频</button>
    </section>
    </div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
